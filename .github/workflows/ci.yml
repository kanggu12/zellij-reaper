name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of CI first.
  workflow_call:
  # By hand, from the Actions tab or `gh workflow run ci.yml`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt, vet, staticcheck, shellcheck, go test -race
        run: make check
      # The notices ship with every release: they must list what the binary
      # is built from now.
      - name: third-party notices are current
        run: make notices && git diff --exit-code docs/THIRD_PARTY_NOTICES.md
      # GitHub's image proxy gives up on shields.io's live release badge, so
      # the README names the release itself, which a release must keep up.
      - name: the README's release badge names the newest release
        run: |
          v=$(awk '/^## \[[0-9]/ { gsub(/[][]/, "", $2); print $2; exit }' CHANGELOG.md)
          grep -q "img.shields.io/badge/release-v$v-" README.md || { echo "README.md's release badge does not say v$v"; exit 1; }

  integration:
    name: zellij ${{ matrix.zellij }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zellij: ["0.43.1", "0.44.3", "0.45.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: real sessions in a throwaway container
        run: test/integration/run.sh ${{ matrix.zellij }}

  build:
    name: release build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --config .github/goreleaser.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*.tar.gz
          retention-days: 7
