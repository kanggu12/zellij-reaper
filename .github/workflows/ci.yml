name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of CI first.
  workflow_call:
  # By hand, from the Actions tab or `gh workflow run ci.yml`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt, vet, staticcheck, shellcheck, go test -race
        run: make check
      # The notices ship with every release: they must list what the binary
      # is built from now.
      # A short run of every fuzz target on top of the seeds go test runs.
      - name: fuzzing, 10s per target
        run: make fuzz FUZZTIME=10s
      - name: third-party notices are current
        run: make notices && git diff --exit-code docs/THIRD_PARTY_NOTICES.md
      # The README's badges are files (make badges): GitHub's image proxy gives
      # up on shields.io too often. The release one must name the newest release.
      - name: the README's release badge names the newest release
        run: |
          v=$(awk '/^## \[[0-9]/ { gsub(/[][]/, "", $2); print $2; exit }' CHANGELOG.md)
          if ! grep -q "aria-label=\"release: v$v\"" docs/assets/badges/release.svg || ! grep -q "alt=\"Release v$v\"" README.md; then
            echo "the release badge does not say v$v: run make badges"
            exit 1
          fi

  integration:
    name: zellij ${{ matrix.zellij }}${{ matrix.runner != 'ubuntu-latest' && ' on arm64' || '' }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        zellij: ["0.43.1", "0.44.3", "0.45.1"]
        # Named in the matrix, so the arm64 entry below adds a job instead of
        # moving the amd64 0.45.1 one to arm64.
        runner: ["ubuntu-latest"]
        # Releases ship for arm64 too: the newest zellij runs there as well.
        include:
          - zellij: "0.45.1"
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: real sessions in a throwaway container
        run: test/integration/run.sh ${{ matrix.zellij }}

  build:
    name: release build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --config .github/goreleaser.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*.tar.gz
          retention-days: 7
