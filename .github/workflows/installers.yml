name: installers

# The installers as people run them, from a published release: the release's
# linux-installer.sh and macos-installer.sh, and its windows-installer.ps1, from the
# addresses the README gives and with nothing set, so each installs the release
# it came with. Each checks the binary is that release, and its timers with
# doctor, and uninstalls.
# A release made by the release workflow does not start other workflows, so
# that workflow calls this one once the release is out.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: release to install, v0.16.1 or later (default the latest)
        required: false

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.system }}-installer.sh on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: linux
          - os: macos-latest
            system: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: the release
        id: release
        env:
          WANT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        # A release typed without its v is the same tag.
        run: |
          v=${WANT:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          case "$v" in v*) ;; *) v=v$v ;; esac
          echo "version=$v" >>"$GITHUB_OUTPUT"
      - name: install
        env:
          V: ${{ steps.release.outputs.version }}
          # A runner has no systemd user instance; the timers are checked
          # where there is one (macOS here).
          ZELLIJ_REAPER_NO_TIMER: ${{ runner.os == 'Linux' && '1' || '' }}
        # The files' names have the version without its v, the address with it.
        run: curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$V/zellij-reaper-${V#v}-${{ matrix.system }}-installer.sh" | sh
      - name: check
        env:
          V: ${{ steps.release.outputs.version }}
        run: |
          ~/.local/bin/zellij-reaper version | tee version.txt
          grep -qF "zellij-reaper $V " version.txt
          if [ "$RUNNER_OS" = macOS ]; then
            ~/.local/bin/zellij-reaper doctor | tee doctor.txt || true
            grep -q 'launchd answers' doctor.txt
            grep -q 'timer enabled' doctor.txt
            ~/.local/bin/zellij-reaper uninstall --purge
          fi

  windows:
    # In PowerShell 7 and in Windows PowerShell 5.1, which every Windows has.
    # A step's shell cannot come from a matrix, so each has its own job.
    name: windows-installer.ps1 in PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: the release
        id: release
        shell: bash
        env:
          WANT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        # A release typed without its v is the same tag.
        run: |
          v=${WANT:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          case "$v" in v*) ;; *) v=v$v ;; esac
          echo "version=$v" >>"$GITHUB_OUTPUT"
      - name: install
        shell: pwsh
        env:
          V: ${{ steps.release.outputs.version }}
        run: irm "https://github.com/${{ github.repository }}/releases/download/$env:V/zellij-reaper-$($env:V.Substring(1))-windows-installer.ps1" | iex
      - name: check
        shell: pwsh
        env:
          V: ${{ steps.release.outputs.version }}
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\zellij-reaper\zellij-reaper.exe'
          $version = & $exe version | Out-String
          $version
          if (-not $version.StartsWith("zellij-reaper $env:V ")) { 'not the release the script came with'; exit 1 }
          $doctor = & $exe doctor | Out-String
          $doctor
          if ($doctor -notmatch 'Task Scheduler answers' -or $doctor -notmatch 'timer enabled') { exit 1 }
          if (-not (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains (Split-Path $exe))) { 'not on PATH'; exit 1 }
          & $exe uninstall --purge
          exit 0

  windows-5:
    name: windows-installer.ps1 in Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: the release
        id: release
        shell: bash
        env:
          WANT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        # A release typed without its v is the same tag.
        run: |
          v=${WANT:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          case "$v" in v*) ;; *) v=v$v ;; esac
          echo "version=$v" >>"$GITHUB_OUTPUT"
      - name: install
        shell: powershell
        env:
          V: ${{ steps.release.outputs.version }}
        run: irm "https://github.com/${{ github.repository }}/releases/download/$env:V/zellij-reaper-$($env:V.Substring(1))-windows-installer.ps1" | iex
      - name: check
        shell: powershell
        env:
          V: ${{ steps.release.outputs.version }}
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\zellij-reaper\zellij-reaper.exe'
          $version = & $exe version | Out-String
          $version
          if (-not $version.StartsWith("zellij-reaper $env:V ")) { 'not the release the script came with'; exit 1 }
          $doctor = & $exe doctor | Out-String
          $doctor
          if ($doctor -notmatch 'Task Scheduler answers' -or $doctor -notmatch 'timer enabled') { exit 1 }
          if (-not (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains (Split-Path $exe))) { 'not on PATH'; exit 1 }
          & $exe uninstall --purge
          exit 0
