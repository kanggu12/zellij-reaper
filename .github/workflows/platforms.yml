name: platforms

# zellij-reaper on macOS and Windows: the unit tests, and real zellij sessions
# on the runner itself, since no container can stand in for those systems.
on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  real:
    name: real sessions on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: zellij-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            asset: zellij-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: zellij 0.45.1
        run: |
          mkdir -p "$RUNNER_TEMP/zellij"
          curl -fsSL -o "$RUNNER_TEMP/zellij/$ASSET" "https://github.com/zellij-org/zellij/releases/download/v0.45.1/$ASSET"
          cd "$RUNNER_TEMP/zellij"
          case "$ASSET" in
            *.zip) unzip -q "$ASSET" ;;
            *) tar -xzf "$ASSET" ;;
          esac
          echo "$RUNNER_TEMP/zellij" >> "$GITHUB_PATH"
        env:
          ASSET: ${{ matrix.asset }}
      - name: build
        run: go build -o "zellij-reaper$(go env GOEXE)" ./cmd/zellij-reaper
      - name: real sessions, checked
        if: runner.os != 'Windows'
        run: test/native/scenarios.sh
        timeout-minutes: 15
      # In a console of its own: a CI step has none, and zellij then gives a
      # shell pane a console with no input, so the shell ends at once. The
      # scenarios start zellij servers that outlive them, so the step waits
      # for the file the run writes last, not for its processes.
      - name: real sessions, checked, in a console
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $done = Join-Path $env:RUNNER_TEMP 'scenarios.done'
          $out = Join-Path $env:RUNNER_TEMP 'scenarios.out'
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          $cmd = "test/native/scenarios.sh > '$($out -replace '\\','/')' 2>&1; echo `$? > '$($done -replace '\\','/')'"
          Start-Process -FilePath $bash -ArgumentList '-c', "`"$cmd`"" -WorkingDirectory $PWD -WindowStyle Hidden
          for ($i = 0; $i -lt 600 -and -not (Test-Path $done); $i++) { Start-Sleep 1 }
          Get-Content $out -ErrorAction SilentlyContinue
          if (-not (Test-Path $done)) { Write-Output 'the scenarios did not finish'; exit 1 }
          exit [int](Get-Content $done)
