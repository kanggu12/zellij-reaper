name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A release is built only from a commit that passes every check, on Linux,
  # macOS and Windows.
  ci:
    uses: ./.github/workflows/ci.yml
  platforms:
    uses: ./.github/workflows/platforms.yml

  release:
    needs: [ci, platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance below: a token to sign it with, and the
      # right to store it with the repository's attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Built from a clean module cache: one another workflow filled
          # does not reach what is published.
          cache: false
      - name: release notes from CHANGELOG.md
        run: |
          # The section for this tag, up to the next "## " heading.
          awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[?" tag "\\]?( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # The same goreleaser as `make snapshot`, not whichever is newest.
          version: v2.19.0
          args: release --clean --config .github/goreleaser.yaml --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A signed statement of where and from what each file in checksums.txt
      # was built: `gh attestation verify FILE --repo kanggu12/zellij-reaper`
      # checks a download against it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  # The demo image: the dashboard on demo sessions, without a clone or Go.
  demo-image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: |
          # The tag without its v, and the owner in lower case, which ghcr wants.
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "date=$(git log -1 --format=%cs)"
            echo "commit=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: test/demo/Dockerfile
          platforms: linux/amd64,linux/arm64
          # So `zellij-reaper version` in the image reports the release.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.v.outputs.commit }}
            DATE=${{ steps.v.outputs.date }}
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/zellij-reaper-demo:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/zellij-reaper-demo:latest
          # The label GitHub reads to show the package on the repository page.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Try the zellij-reaper dashboard on demo sessions
            org.opencontainers.image.licenses=MIT

  # The installers as people run them, from the release just published.
  installers:
    needs: release
    uses: ./.github/workflows/installers.yml
    with:
      version: ${{ github.ref_name }}
