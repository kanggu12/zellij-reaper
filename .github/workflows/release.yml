name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A release is built only from a commit that passes every check, on Linux,
  # macOS and Windows.
  ci:
    uses: ./.github/workflows/ci.yml
  platforms:
    uses: ./.github/workflows/platforms.yml

  release:
    needs: [ci, platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: release notes from CHANGELOG.md
        run: |
          # The section for this tag, up to the next "## " heading.
          awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[?" tag "\\]?( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config .github/goreleaser.yaml --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The demo image: the dashboard on demo sessions, without a clone or Go.
  demo-image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: |
          # The tag without its v, and the owner in lower case, which ghcr wants.
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "date=$(git log -1 --format=%cs)"
            echo "commit=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: test/demo/Dockerfile
          platforms: linux/amd64,linux/arm64
          # So `zellij-reaper version` in the image reports the release.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.v.outputs.commit }}
            DATE=${{ steps.v.outputs.date }}
          push: true
          tags: |
            ghcr.io/${{ steps.v.outputs.owner }}/zellij-reaper-demo:${{ steps.v.outputs.version }}
            ghcr.io/${{ steps.v.outputs.owner }}/zellij-reaper-demo:latest
          # The label GitHub reads to show the package on the repository page.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Try the zellij-reaper dashboard on demo sessions
            org.opencontainers.image.licenses=MIT

  # The installers as people run them, from the release just published.
  installers:
    needs: release
    uses: ./.github/workflows/installers.yml
    with:
      version: ${{ github.ref_name }}
