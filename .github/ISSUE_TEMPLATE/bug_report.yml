name: Bug report
description: A session was kept or deleted when it should not have been, or something does not work as the docs say.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead. For a session, what was running in it.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: The session in `zellij-reaper plan --json`
      description: The entry for the session, taken before it was reaped if you can. Replace a private name with any placeholder.
      render: json
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The lines about it from `zellij-reaper logs -n 200`.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: "`zellij-reaper doctor`"
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: zellij-reaper v0.1.0, zellij 0.45.1, Ubuntu 24.04 (or WSL 2)
    validations:
      required: true
