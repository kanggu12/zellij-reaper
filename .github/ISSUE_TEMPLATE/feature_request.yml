name: Feature request
description: Something zellij-reaper could do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where zellij-reaper gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How it could work. If it changes which sessions are reaped, say how it keeps the ones in use safe.
