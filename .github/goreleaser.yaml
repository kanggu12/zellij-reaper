# Release build: static binaries for Linux, macOS and Windows, archives,
# checksums, and packages for Linux.
version: 2

project_name: zellij-reaper

builds:
  - main: ./cmd/zellij-reaper
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # zellij has no Windows build for arm64.
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/kanggu12/zellij-reaper/internal/version.Version=v{{ .Version }}
      - -X github.com/kanggu12/zellij-reaper/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/kanggu12/zellij-reaper/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    # Windows people open a zip; scripts/install.ps1 does too.
    format_overrides:
      - goos: windows
        formats: [zip]
    # scripts/install.sh and install.ps1 download this exact name.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # Next to LICENSE in the archive, where people look for it.
      - src: docs/THIRD_PARTY_NOTICES.md
        dst: THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: zellij-reaper
    # Packages are for Linux; nfpm takes only the Linux builds.
    homepage: https://github.com/kanggu12/zellij-reaper
    maintainer: J.-G. Kang <kanggu12@gmail.com>
    description: Reap idle and exited zellij sessions, safely.
    license: MIT
    # Where a Debian package manager files it; without one the field is left
    # out of the package.
    section: utils
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    # pacman shows "Unknown Packager" unless the package names one; the deb
    # and the rpm take theirs from the maintainer above.
    archlinux:
      packager: J.-G. Kang <kanggu12@gmail.com>
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/zellij-reaper/LICENSE
      - src: docs/THIRD_PARTY_NOTICES.md
        dst: /usr/share/licenses/zellij-reaper/THIRD_PARTY_NOTICES.md

# The release notes are the CHANGELOG.md section the release workflow passes with
# --release-notes. The changelog must stay on for that: disabled, it drops them too.

release:
  # The notes come from CHANGELOG.md, written by hand for each release.
  mode: replace
  # The installer travels with the release, so its address does not depend on
  # where it lives in the repository.
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1
