# Release build: static binaries for Linux, macOS and Windows, archives,
# checksums, and packages for Linux.
version: 2

project_name: zellij-reaper

# Every file a release carries is named zellij-reaper-X.Y.Z-..., the version
# without its v: the archives and packages go on with the system (linux,
# macos, windows) and the machine, x64 or arm64 on every system; the install
# scripts with the system each is for.

# A snapshot (make snapshot, CI's release build) is named as the next minor
# release would be, so the installers' check for the names before 0.16.1 lets
# it through.
snapshot:
  version_template: "{{ incminor .Version }}-snapshot"

before:
  hooks:
    # The installers with the release written in: each installs the release it
    # came with, the one its name says.
    - sh scripts/installers.sh v{{ .Version }} build/installers

builds:
  - main: ./cmd/zellij-reaper
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # zellij has no Windows build for arm64.
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/kanggu12/zellij-reaper/internal/version.Version=v{{ .Version }}
      - -X github.com/kanggu12/zellij-reaper/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/kanggu12/zellij-reaper/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    # Windows people open a zip; scripts/install.ps1 does too.
    format_overrides:
      - goos: windows
        formats: [zip]
    # scripts/install.sh and install.ps1 download this exact name, and take the
    # binary out of the folder of the same name the archive holds.
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}-{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # Next to LICENSE in the archive, where people look for it.
      - src: docs/THIRD_PARTY_NOTICES.md
        dst: THIRD_PARTY_NOTICES.md

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"
  # The installers too: people pipe them into a shell, and the release's
  # build provenance attests what the checksums file lists.
  extra_files:
    - glob: build/installers/linux-installer.sh
      name_template: "{{ .ProjectName }}-{{ .Version }}-linux-installer.sh"
    - glob: build/installers/macos-installer.sh
      name_template: "{{ .ProjectName }}-{{ .Version }}-macos-installer.sh"
    - glob: build/installers/windows-installer.ps1
      name_template: "{{ .ProjectName }}-{{ .Version }}-windows-installer.ps1"

nfpms:
  - package_name: zellij-reaper
    # Packages are for Linux; nfpm takes only the Linux builds.
    homepage: https://github.com/kanggu12/zellij-reaper
    maintainer: J.-G. Kang <kanggu12@gmail.com>
    description: Reap idle and exited zellij sessions, safely.
    license: MIT
    # Where a Debian package manager files it; without one the field is left
    # out of the package.
    section: utils
    formats: [deb, rpm, apk, archlinux]
    # Named as the archives are; the package managers read the version and the
    # machine from inside the package, not from its file name.
    file_name_template: >-
      {{ .ProjectName }}-{{ .Version }}-linux-{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}{{ .ConventionalExtension }}
    bindir: /usr/bin
    # pacman shows "Unknown Packager" unless the package names one; the deb
    # and the rpm take theirs from the maintainer above.
    archlinux:
      packager: J.-G. Kang <kanggu12@gmail.com>
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/zellij-reaper/LICENSE
      - src: docs/THIRD_PARTY_NOTICES.md
        dst: /usr/share/licenses/zellij-reaper/THIRD_PARTY_NOTICES.md

# The release notes are the CHANGELOG.md section the release workflow passes with
# --release-notes. The changelog must stay on for that: disabled, it drops them too.

release:
  # The notes come from CHANGELOG.md, written by hand for each release.
  mode: replace
  # The installers travel with the release, each with the release written in,
  # so the address of one names the release it installs.
  extra_files:
    - glob: build/installers/linux-installer.sh
      name_template: "{{ .ProjectName }}-{{ .Version }}-linux-installer.sh"
    - glob: build/installers/macos-installer.sh
      name_template: "{{ .ProjectName }}-{{ .Version }}-macos-installer.sh"
    - glob: build/installers/windows-installer.ps1
      name_template: "{{ .ProjectName }}-{{ .Version }}-windows-installer.ps1"
